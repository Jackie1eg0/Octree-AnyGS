# =============================================================================
# Octree-GS LOD模型配置 (多层八叉树 + 自适应LOD)
# 对应模型类: scene/gs_model_scaffoldgs/lod_model.py → GaussianLoDModel
# 相比 base_model.yaml, 新增了八叉树构建/LOD选择/渐进训练/跨层生长的全部参数
# =============================================================================

# 模型参数
model_params: {
    model_config: {
        name: "GaussianLoDModel",       # ▼ 区别: 使用带LOD的八叉树模型(Octree-GS核心)
        kwargs: {
            feat_dim: 32,               # 锚点特征维度(与base_model相同)
            view_dim: 3,                # 视角方向维度(与base_model相同)
            appearance_dim: 0,          # 外观嵌入维度(0=关闭, >0启用阶段五, 与base_model相同)
            padding: 0.0,               # 体素网格填充偏移(与base_model相同)
            n_offsets: 10,              # 每个锚点生成的高斯个数(与base_model相同)

            # ============================================================
            # ▼ Octree-GS 独有: 八叉树结构参数 (替代base_model的单尺度体素) ▼
            # 【阶段一: 八叉树构建与锚点初始化】
            # ============================================================
            fork: 2,                    # 八叉树分支因子(每层体素边长 = 上层/fork)
                                        # fork=2 即标准八叉树(2³=8子节点)
            base_layer: 11,             # 八叉树基础层号, 决定最粗体素大小
                                        # voxel_size = box_d / (fork^base_layer)
                                        # -1 则自动根据default_voxel_size=0.02计算
            levels: -1,                 # LOD总层数K, -1=自动计算
                                        # K = round(log2(d_max/d_min)) + 1
            init_level: -1,             # 渐进训练初始激活层, -1=自动设为 K/2
            extend: 1.1,                # 场景包围盒扩展系数(避免边缘截断)
            dist_ratio: 0.999,          # 论文rd, 取99.9%分位数作为d_max
                                        # (排除离群点, 0.1%分位作为d_min)

            # 【阶段二: 自适应LOD选择】
            dist2level: 'round',        # L*→离散级别的取整方式:
                                        #   'floor':  向下取整
                                        #   'round':  四舍五入(默认)
                                        #   'ceil':   向上取整
                                        #   'progressive': 支持平滑过渡(opacity插值)
            visible_threshold: 0.9,     # 可见频率阈值τ_v, 低于此值的锚点被weed_out
                                        # (小场景=0.7, 大场景=0.01, 多尺度=0.2)

            # 【渐进训练开关】
            progressive: True,          # 是否启用从粗到精的渐进式训练(阶段三)
            # ============================================================

            use_feat_bank: False,       # 是否使用多分辨率特征库(与base_model相同)
        }
    },
    base_model: "scaffoldgs",           # 渲染后端: scaffoldgs
    source_path: "./data/bicycle",      # 数据集路径(COLMAP格式)
    dataset_name: "mipnerf360",
    scene_name: "Bicycle_Apply_Octree", # ▼ 区别: 场景名标注了Octree
    images: "images",
    resolution: -1,                     # -1=使用原始分辨率
    white_background: False,
    random_background: False,
    resolution_scales: [1.0],           # 多分辨率训练(1.0=仅原始分辨率)
    data_device: "cuda",
    eval: True,
    ratio: 1,
    render_mode: "RGB",
}

# Pipeline参数(与base_model相同)
pipeline_params: {
    compute_cov3D_python:  False,
    debug:  False
}


# 优化参数
optim_params: {
    iterations: 40_000,                 # 总训练迭代次数(与base_model相同)

    # --- 锚点位置学习率(lr=0, 不学习锚点位置) ---
    position_lr_init: 0.0,
    position_lr_final: 0.0,
    position_lr_delay_mult: 0.01,
    position_lr_max_steps: 40_000,
    
    # --- 偏移量学习率 ---
    offset_lr_init: 0.01,
    offset_lr_final: 0.0001,
    offset_lr_delay_mult: 0.01,
    offset_lr_max_steps: 40_000,

    # --- 其他可学习参数(与base_model相同) ---
    feature_lr: 0.0075,
    scaling_lr: 0.007,
    rotation_lr: 0.002,
    
    # --- MLP学习率(与base_model相同) ---
    mlp_opacity_lr_init: 0.002,
    mlp_opacity_lr_final: 0.00002,  
    mlp_opacity_lr_delay_mult: 0.01,
    mlp_opacity_lr_max_steps: 40_000,

    mlp_cov_lr_init: 0.004,
    mlp_cov_lr_final: 0.004,
    mlp_cov_lr_delay_mult: 0.01,
    mlp_cov_lr_max_steps: 40_000,
    
    mlp_color_lr_init: 0.008,
    mlp_color_lr_final: 0.00005,
    mlp_color_lr_delay_mult: 0.01,
    mlp_color_lr_max_steps: 40_000,
    
    mlp_featurebank_lr_init: 0.01,
    mlp_featurebank_lr_final: 0.00001,
    mlp_featurebank_lr_delay_mult: 0.01,
    mlp_featurebank_lr_max_steps: 40_000,

    appearance_lr_init: 0.05,
    appearance_lr_final: 0.0005,
    appearance_lr_delay_mult: 0.01,
    appearance_lr_max_steps: 40_000,

    # --- 损失函数权重(与base_model相同) ---
    lambda_dssim: 0.2,
    lambda_dreg: 0.01,
    
    lambda_normal: 0.0,
    normal_start_iter: 7_000,
    lambda_dist: 0.0,
    dist_start_iter: 3_000,

    # --- 致密化调度 ---
    start_stat: 500,                    # 开始收集梯度统计(与base_model相同)
    update_from: 1500,                  # 开始执行致密化(与base_model相同)

    # ============================================================
    # ▼ Octree-GS 独有: 渐进式训练调度参数 ▼
    # 【阶段三: 渐进式训练 Coarse-to-Fine】
    # ============================================================
    coarse_iter: 10000,                 # 渐进式训练总步数(前10k步从粗到精解锁层级)
    coarse_factor: 1.5,                 # 生长因子ω, 粗糙层分配更多步数
                                        # 相邻层训练步数比: N_{i-1} = ω × N_i
    # ============================================================

    update_interval: 100,               # 每100步触发一次致密化(与base_model相同)
    update_until: 25000,                # ▼ 区别: 致密化截止步(比base_model的20000更晚)
                                        # 因为渐进训练需要更多时间完成跨层生长
    overlap: False,
    densification: True,

    # --- 剪枝/生长阈值 ---
    min_opacity: 0.005,                 # 低不透明度剪枝阈值(与base_model相同)
    success_threshold: 0.8,             # (与base_model相同)
    densify_grad_threshold: 0.0002,     # 基础梯度阈值τ_g(与base_model相同)
                                        # 但LOD模型中会乘以层级指数: τ_L = τ_g × (fork^β)^L

    # ============================================================
    # ▼ Octree-GS 独有: 跨层生长 & ΔL自适应更新参数 ▼
    # 【阶段四: Next-level Growing & ΔL Update】
    # ============================================================
    update_ratio: 0.2,                  # β(论文), 梯度阈值指数因子
                                        # τ_L = τ_g × (fork^β)^L
                                        # 层级越高(越精细), 阈值越大, 越难触发生长
    extra_ratio: 0.25,                  # ΔL更新的梯度阈值比例
                                        # 条件: anchor级梯度 > τ_L × extra_ratio
    extra_up: 0.02,                     # ε, 每次ΔL增加的步长
                                        # _extra_level += extra_up (论文写0.01, 代码用0.02)
    # ============================================================
}